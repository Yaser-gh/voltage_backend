services:
  api:
    build: .
    container_name: voltage_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voltage_user:voltage_pass@db:5432/voltage_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/srv/app/app/uploads
    networks:
      - voltage_net

  db:
    image: postgres:16-alpine
    container_name: voltage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltage_user
      POSTGRES_PASSWORD: voltage_pass
      POSTGRES_DB: voltage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltage_user -d voltage_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltage_net

  redis:
    image: redis:7-alpine
    container_name: voltage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltage_net

volumes:
  postgres_data:
  uploads_data:

networks:
  voltage_net:
    driver: bridge
